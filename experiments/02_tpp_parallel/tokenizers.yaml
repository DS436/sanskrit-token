# Provisional T1/T2 tokenizer training and the matched English control E1 (exp02 Tasks 4, 6).
#
# Trains BPE and Unigram tokenizers on the Sanskrit side of the Sāmayik and Itihāsa
# *training* splits, in SLP1, at matched 32k/64k/128k vocabulary sizes (CLAUDE.md §2.5).
# These arms are provisional (docs/decisions.md, "Provisional T1/T2 tokenizers..."): they will
# be retrained on the monolingual corpus (DCS, GRETIL, Wikipedia) once milestone M1 lands.
#
# The `E1_*` arms (`side: en`) are the matched English control: same algorithms, same
# vocabulary sizes, same trainer settings, trained on the *English* side of those same
# training splits (docs/decisions.md, "Add a matched English control family E1 for TPP").
# The English corpus is not transliterated and is asserted against its own exclusion list.
# The `E1_*_bm` arms (`side: en_bm`) are the same control on a byte-matched subsample of
# that English corpus (docs/decisions.md, 2026-09-08); every family is trained at 32k, 64k
# and 128k so a controlled result can be checked against the vocabulary size it was
# measured at.
#
# The `T4_*` arms (`side: sa_split`, Experiment 03) are the same again one transform over:
# the same Devanagari sentences as `T1`/`T2`, written to the corpus as ByT5-Sanskrit's
# segmentation *reconciled* against the raw sentence (docs/decisions.md, "T4 text is the
# model's segmentation reconciled against the raw sentence"). The split text is read from
# `split_cache_path`, which `experiments/03_sandhi_split/split_corpora.py` fills; this
# script never loads the splitter model and fails with a count if the cache is short.
# The throughput rule selected the full corpus, so there are no matched `_sub` arms.
#
# Relative paths are resolved against the repository root, not the working directory.

corpus_path: data/processed/tok_train_slp1.txt
english_corpus_path: data/processed/tok_train_en.txt

# The byte-matched English corpus (`side: en_bm`, the `E1_*_bm` arms): a deterministic
# subsample of `english_corpus_path` cut to `corpus_path`'s UTF-8 byte count, written by
# this script (`build_byte_matched_corpus`) with `manifest_en_bm.json` beside it. The
# pair-matched English corpus is 48% larger in bytes than the Sanskrit one at the same
# sentence count, so "the same corpus" has two readings and the two families measure both.
english_bm_corpus_path: data/processed/tok_train_en_bm.txt
byte_match_seed: 0
split_corpus_path: data/processed/tok_train_slp1_split.txt

# Both written by experiments/03_sandhi_split/split_corpora.py; read-only here. The
# manifest's `reconcile_threshold` is authoritative — it records what the corpus was
# actually reconciled with — and the value below is checked against it, not trusted.
split_cache_path: data/processed/split/cache.jsonl
split_manifest_path: data/processed/split/manifest.json
split_reconcile_threshold: 0.6

# Prose before verse (CLAUDE.md §7): Sāmayik precedes Itihāsa in every table and config.
sources:
  - samayik_train
  - itihasa_train

english_sources:
  - samayik_train_en
  - itihasa_train_en

exclusion_path: data/exclusion_hashes.txt
english_exclusion_path: data/exclusion_hashes_en.txt

arms:
  - name: T1_bpe_raw_32k
    algo: bpe
    vocab_size: 32000
    side: sa
  - name: T1_bpe_raw_64k
    algo: bpe
    vocab_size: 64000
    side: sa
  - name: T2_unigram_raw_32k
    algo: unigram
    vocab_size: 32000
    side: sa
  - name: T2_unigram_raw_64k
    algo: unigram
    vocab_size: 64000
    side: sa
  - name: E1_bpe_32k
    algo: bpe
    vocab_size: 32000
    side: en
  - name: E1_bpe_64k
    algo: bpe
    vocab_size: 64000
    side: en
  - name: E1_unigram_32k
    algo: unigram
    vocab_size: 32000
    side: en
  - name: E1_unigram_64k
    algo: unigram
    vocab_size: 64000
    side: en
  - name: T1_bpe_raw_128k
    algo: bpe
    vocab_size: 128000
    side: sa
  - name: T2_unigram_raw_128k
    algo: unigram
    vocab_size: 128000
    side: sa
  - name: E1_bpe_128k
    algo: bpe
    vocab_size: 128000
    side: en
  - name: E1_unigram_128k
    algo: unigram
    vocab_size: 128000
    side: en
  - name: E1_bpe_32k_bm
    algo: bpe
    vocab_size: 32000
    side: en_bm
  - name: E1_bpe_64k_bm
    algo: bpe
    vocab_size: 64000
    side: en_bm
  - name: E1_bpe_128k_bm
    algo: bpe
    vocab_size: 128000
    side: en_bm
  - name: E1_unigram_32k_bm
    algo: unigram
    vocab_size: 32000
    side: en_bm
  - name: E1_unigram_64k_bm
    algo: unigram
    vocab_size: 64000
    side: en_bm
  - name: E1_unigram_128k_bm
    algo: unigram
    vocab_size: 128000
    side: en_bm
  - name: T4_bpe_split_32k
    algo: bpe
    vocab_size: 32000
    side: sa_split
  - name: T4_bpe_split_64k
    algo: bpe
    vocab_size: 64000
    side: sa_split
  - name: T4_unigram_split_32k
    algo: unigram
    vocab_size: 32000
    side: sa_split
  - name: T4_unigram_split_64k
    algo: unigram
    vocab_size: 64000
    side: sa_split

seed: 0

output_dir: outputs/tokenizers
