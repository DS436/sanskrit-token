# Experiment 02 — tokens-per-proposition on parallel text (RQ2), CLAUDE.md §7.
#
# Relative paths are resolved against the repository root (the parent of `experiments/`),
# not the working directory, so the runner works from anywhere in the repo.

corpora:               # prose before verse; order is binding for tables and figure panels
  - {name: samayik_test, loader: samayik, split: test}
  - {name: samayik_test_ood, loader: samayik, split: test_ood}
  - {name: itihasa_test, loader: itihasa, split: test}
  - {name: flores_devtest, loader: flores, split: devtest, jsonl: data/raw/flores/devtest.jsonl}

sanskrit_arms: [T0_o200k, T0_llama4, T0_gemma3, T0_gpt2, T3_sarvam, T3_sutra, T3_indicsuper, T3_brahmic131k, T1_bpe_raw_32k, T1_bpe_raw_64k, T2_unigram_raw_32k, T2_unigram_raw_64k]

# Deployed practice only: o200k primary, Llama-4 secondary. The E1 control arms are
# deliberately NOT listed here — pairing every Sanskrit arm with every E1 arm would fill
# results.json["tpp"] with cross-entries nothing reads (a T0 arm over an in-domain English
# control interprets as neither deployed practice nor a matched comparison). The controlled
# comparison comes from `controlled_pairs` below, which names the one E1 arm each Sanskrit
# arm is matched to; run.py loads those arms whether or not they appear in this list.
english_pivots: [T0_o200k, T0_llama4]      # o200k is primary

# The controlled headline: each Sanskrit arm against the English arm that matches it on
# algorithm, vocabulary size and training corpus. Measured on the SLP1 variant (T1/T2 have
# no other) against the English side as written; recorded under results.json's
# `tpp_controlled` and drawn as the figure's right-hand column.
controlled_pairs:
  - [T1_bpe_raw_32k, E1_bpe_32k]
  - [T1_bpe_raw_64k, E1_bpe_64k]
  - [T2_unigram_raw_32k, E1_unigram_32k]
  - [T2_unigram_raw_64k, E1_unigram_64k]
figure_pivot_controlled: true

hindi_pivot_corpus: flores_devtest         # Sa/Hi under the same tokenizer, T0/T3 arms only

script_variants: {T0: [original, slp1], T3: [original, slp1], T1: [slp1], T2: [slp1]}

# Rényi efficiency (Zouhar et al. 2023) is a secondary intrinsic, recorded per arm and
# never headlined: it can be gamed without changing the tokenization (Cognetta et al. 2024).
renyi_alphas: [2.5, 3.0]

n_bootstrap: 1000
seed: 0
ci: 0.95

exclusion_path: data/exclusion_hashes.txt
# The English side of the same six evaluation splits, hashed with `sentence_hash_en`: what
# kept the E1 control arms away from this evaluation text (results.json's
# `exclusion_check_en` re-verifies it every run).
exclusion_path_en: data/exclusion_hashes_en.txt
output_dir: outputs/02_tpp_parallel

# Length-stratified TPP (results.json's `tpp_by_length`, figure `tpp_by_length.pdf`).
# Bins are FIXED, absolute, inclusive lower bounds on the ENGLISH side's whitespace word
# count — 1-8, 9-16, 17-24, 25-40, 41+ — so a verse line and a prose sentence of the same
# length land in the same bin and can be read against each other across panels. Per-corpus
# quantile bins would make that impossible: Itihāsa's and Sāmayik's bins would share a
# name and cover different lengths. Binning on the Sanskrit word count is also rejected:
# that denominator is the quantity under study.
length_bin_edges: [1, 9, 17, 25, 41]
length_sparse_below: 30    # bins with fewer pairs are flagged `sparse` and drawn hollow
