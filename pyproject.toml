[project]
name = "sanskrit-tok"
version = "0.1.0"
description = "Does Sanskrit's morphological density survive subword tokenization?"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Devansh Sharma" }]
# Upper bounds cap each dependency below the next major after the version
# `uv.lock` currently resolves, so the declared range matches the lock.
dependencies = [
    "tokenizers>=0.20,<1",
    "transformers>=4.44,<6",
    "sentencepiece>=0.2,<1",
    "indic-transliteration>=2.3,<3",
    "datasets>=2.20,<6",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "pyyaml>=6.0,<7",
    "matplotlib>=3.9,<4",
    "tiktoken>=0.7,<1",
    "huggingface-hub>=0.24,<2",
    "pyarrow>=17,<26",
    "protobuf>=4.25,<8",
    "torch>=2.4,<3",
]

[project.urls]
Repository = "https://github.com/DS436/sanskrit-token"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.6,<1",
    "mypy>=1.11,<3",
    "types-PyYAML>=6.0,<7",
    "pandas-stubs>=2.2,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sanskrit_tok"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# `src/sanskrit_tok/lm/model.py` is nanoGPT vendored byte-for-byte (its header records the
# upstream commit and file sha256). Linting it would mean reformatting it, which would
# destroy the correspondence that makes that provenance checkable, so every selected rule
# is waived for that one file and no other.
[tool.ruff.lint.per-file-ignores]
"src/sanskrit_tok/lm/model.py" = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src"]
# `scripts/` is checked explicitly (`mypy scripts`) and imports the project by name;
# without this it would resolve to the installed distribution, which ships no py.typed.
mypy_path = "src"

# Third-party libraries that ship no type information.
[[tool.mypy.overrides]]
module = [
    "datasets.*",
    "indic_transliteration.*",
    "matplotlib.*",
    "pyarrow.*",
    "sentencepiece.*",
    "tiktoken.*",
    "tokenizers.*",
    "transformers.*",
]
ignore_missing_imports = true

# Vendored nanoGPT: unannotated upstream code, kept byte-for-byte (see the ruff waiver
# above and the file's own header). Everything this project wrote around it is strict.
[[tool.mypy.overrides]]
module = ["sanskrit_tok.lm.model"]
ignore_errors = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
